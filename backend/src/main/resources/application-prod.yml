# ==============================================================================
# FINOVA – Production Profile Configuration (MySQL)
# Active when SPRING_PROFILES_ACTIVE=prod (Default in Docker container)
# ==============================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${MYSQL_USER}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${MYSQL_PASSWORD}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FinovaHikariCP
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 25
