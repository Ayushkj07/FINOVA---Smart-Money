server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

spring:
  application:
    name: finova-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:${SPRING_MAIL_HOST:}}
    port: ${MAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Profile: MySQL (Production / Standard)
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/finova_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${MYSQL_USER:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${MYSQL_PASSWORD:root}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# Profile: H2 (Testing / Standalone Dev with Persistent Disk Storage)
---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: ${SPRING_DATASOURCE_H2_URL:jdbc:h2:file:./data/finovadb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,MONTH}
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect


# Common Application & Security Settings
---
app:
  jwt:
    secret: ${FINOVA_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}} # 256-bit secure secret key
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/settings/connected-apps/callback}
    encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:c2VjdXJlX2dvb2dsZV90b2tlbl9lbmNyeXB0aW9uX2tleV8yMDI2X2Zpbm92YQ==}
  otp:
    expiration-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
  mail:
    from: ${MAIL_FROM:${SPRING_MAIL_FROM:noreply@finova.com}}
    from-name: "FINOVA Team"
  admin:
    initial-email: ${FINOVA_ADMIN_EMAIL:${INITIAL_ADMIN_EMAIL:}}
    initial-password: ${FINOVA_ADMIN_PASSWORD:${INITIAL_ADMIN_PASSWORD:}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
