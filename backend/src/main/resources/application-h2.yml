# ==============================================================================
# FINOVA – H2 Profile Configuration (Local Testing & Standalone Development)
# Active when SPRING_PROFILES_ACTIVE=h2
# ==============================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_H2_URL:jdbc:h2:file:./data/finovadb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,MONTH}
    username: sa
    password: ""
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
