version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: finova-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finova_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: finova_user
      MYSQL_PASSWORD: finova_password
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - finova-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finova-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/finova_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: finova_user
      SPRING_DATASOURCE_PASSWORD: finova_password
      JWT_SECRET: c2VjdXJlX2Zpbm92YV9zZWNyZXRfa2V5X2Zvcl9qd3Rfc2lnbmluZ18yMDI2X2ZpbnRlY2hfcGxhdGZvcm0=
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AIzaSyDemoKeyForFinovaChatbot2026}
    ports:
      - '8080:8080'
    networks:
      - finova-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finova-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '5173:80'
    networks:
      - finova-network

volumes:
  mysql-data:

networks:
  finova-network:
    driver: bridge
